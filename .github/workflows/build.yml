name: Build and Deploy MyLEO FE App
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Linux Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        key: ${{ secrets.KEY }}
        script: |
          echo Changing the directory
          cd ../../www/wwwroot/myleo_frontend/
          echo Pulling repo
          git pull
          echo Building project
          npm install
          npm run build
          rm -rf ../myleo.leomd306.org/assets
          rm -rf ../myleo.leomd306.org/images
          rm -rf ../myleo.leomd306.org/myleo
          mv -vf dist/* ../myleo.leomd306.org
          echo Process finished